<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel English — Arrived</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0f14;
    color: #e8eaed;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-y: auto;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .header {
    width: 100%; max-width: 980px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .title { font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .score { font-size: 14px; color: #9aa7b2; letter-spacing: 1px; }
  .stage {
    position: relative;
    width: 100%; max-width: 980px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    background: #000;
  }
  .scene-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .scene-gradient {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: #0b141c;
  }
  .scene-gradient .label {
    font-size: 28px; font-weight: 800; color: #dce6ee; text-align: center;
    letter-spacing: 1px; text-transform: uppercase; opacity: .35;
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 35%, transparent 55%, rgba(0,0,0,0.75) 100%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }
  .passage-card {
    position: absolute; left: 12px; right: 12px; top: 12px;
    background: rgba(8,12,18,0.78);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
    min-height: 90px;
  }
  .passage-label {
    font-size: 11px; color: #9aa7b2; letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 6px;
  }
  .passage {
    font-size: 15px; line-height: 1.35; color: #f4f5f7;
  }
  .question-card {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    background: rgba(8,12,18,0.82);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
    min-height: 120px;
  }
  .counter {
    font-size: 11px; color: #9aa7b2; letter-spacing: 1.4px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .qtext {
    font-size: 16px; line-height: 1.35; color: #f4f5f7;
  }
  .choices {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice {
    height: 60px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: #f1f3f5; font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  .choice:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  .choice:active { transform: translateY(1px) scale(0.98); }
  .choice.disabled { opacity: .55; pointer-events: none; }
  .choice.correct { border-color: #00e6b8; color: #b9f6ea; box-shadow: 0 0 20px rgba(0,230,184,0.25); }
  .choice.wrong { border-color: #ff6b6b; color: #fcc; box-shadow: 0 0 20px rgba(255,107,107,0.25); }
  .progress { width: 100%; max-width: 980px; display: flex; gap: 6px; }
  .pip {
    height: 8px; flex: 1; border-radius: 4px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14);
  }
  .pip.done { background: linear-gradient(90deg, #00e6b8, #00ffc8); border-color: transparent; box-shadow: 0 0 10px rgba(0,255,200,0.35); }
  .footer { font-size: 11px; color: #5b6572; letter-spacing: 1px; }
  .result {
    position: absolute; inset: 0;
    background: rgba(4,8,14,0.85);
    backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    padding: 24px; text-align: center;
  }
  .result h2 { margin: 0; font-size: 28px; }
  .result p { margin: 0; color: #c8cdd4; }
  .result button {
    height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    color: #f4f5f7; font-weight: 800; letter-spacing: .5px;
    padding: 0 18px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Travel English — Arrived</div>
    <div class="score"><span id="pts">0</span>/<span id="max">15</span></div>
  </div>

  <div class="stage">
    <div class="scene-gradient" id="sceneGradient"><div class="label" id="sceneLabel">Travel</div></div>
    <img id="scene" class="scene-bg" style="display:none;" alt="scene">
    <div class="vignette"></div>
    <div class="passage-card" id="passageCard">
      <div class="passage-label">Situation</div>
      <div class="passage" id="passage">Initializing...</div>
    </div>
    <div class="question-card">
      <div class="counter" id="counter">Q 1 / 15</div>
      <div class="qtext" id="qtext">Initializing...</div>
    </div>
    <div class="result" id="result">
      <h2 id="rtitle">Result</h2>
      <p id="rtext">Score text</p>
      <button id="replay">Play Again</button>
    </div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="choices" id="choices"></div>
  <div class="footer">DENIS — Travel English · Arrived</div>

<script>
(function() {
  'use strict';
  var $ = function(id) { return document.getElementById(id); };

  var SCENE_LABELS = [
    'Taxi queue','Pharmacy','Landmark','Bus stop',
    'Hotel','Ticket office','Cafe','Beach',
    'Park','Hostel','Metro','Market',
    'Clinic','Bookstore','Airport hotel'
  ];

  var ITEMS = [
    {passage:"Denis is staying in Lisbon. He needs to go to the hotel. He lines up at the taxi stand outside the airport.", question:"Why does Denis stand at the taxi stand?", options:["To rent a bike","To buy a bus pass","To get a taxi","To meet a friend"], answer:2, scene:'scenes/scene_01.webp'},
    {passage:"Denis woke up with a headache. He walks into a pharmacy and asks for something strong but safe.", question:"Why does Denis enter the pharmacy?", options:["To buy water","To get medicine","To buy snacks","To ask directions"], answer:1, scene:'scenes/scene_02.webp'},
    {passage:"Denis wants to see the old castle. He shows a paper map to a local and points at it.", question:"What does Denis basically want?", options:["Help finding the castle","Help buying tickets","Help booking a room","Help calling a taxi"], answer:0, scene:'scenes/scene_03.webp'},
    {passage:"Denis misses the last metro. He walks to a bus stop and looks at the schedule pole.", question:"What is Denis trying to do?", options:["Buy food","Find the next bus","Return to the airport","Call home"], answer:1, scene:'scenes/scene_04.webp'},
    {passage:"The hotel front desk asks Denis for his reservation number. He checks his phone email and reads the confirmation slowly.", question:"What is Denis doing?", options:["Checking in","Checking out","Ordering food","Booking later"], answer:0, scene:'scenes/scene_05.webp'},
    {passage:"At the ticket office, Denis asks for a city pass that includes museums and boats. The clerk smiles and shows two cards.", question:"What is Denis interested in?", options:["Food tours","A city pass","Airport taxi","Hotel upgrade"], answer:1, scene:'scenes/scene_06.webp'},
    {passage:"Denis sits at a sidewalk cafe. He speaks slowly and orders by pointing at the menu picture, then asks for the bill.", question:"Why does Denis point at the menu?", options:["He wants dessert","He wants to choose quickly","He wants water","He wants to pay early"], answer:1, scene:'scenes/scene_07.webp'},
    {passage:"At the beach, a vendor walks by selling cold drinks. Denis buys one with a small note in his hand about prices.", question:"What can we infer?", options:["He does not trust prices","He wants something to drink","He wants a tour","He wants directions"], answer:1, scene:'scenes/scene_08.webp'},
    {passage:"Denis sits on a park bench and watches students practice guitar. He feels relaxed and opens his notebook.", question:"What is Denis probably doing there?", options:["Exercising","Resting and studying","Waiting for a train","Looking for food"], answer:1, scene:'scenes/scene_09.webp'},
    {passage:"Denis checks into a hostel dorm. The receptionist gives him a towel, a map, and a breakfast coupon for morning only.", question:"What does Denis receive?", options:["A taxi voucher","A room upgrade","Useful items for his stay","A free dinner"], answer:2, scene:'scenes/scene_10.webp'},
    {passage:"At the metro machine, Denis selects a ticket for zone 2. The display changes and he inserts coins carefully.", question:"What is Denis doing?", options:["Buying a ticket","Asking for help","Giving a donation","Changing money"], answer:0, scene:'scenes/scene_11.webp'},
    {passage:"Denis enters a small market and asks 'how much?' twice before pointing at bread and cheese. He pays with cash.", question:"What is Denis trying to do at the market?", options:["Negotiate prices","Order delivery","Ask directions","Buy food"], answer:3, scene:'scenes/scene_12.webp'},
    {passage:"Denis has an allergy to shellfish. He visits a clinic near the hotel and shows a translation phrase to the doctor.", question:"Why does Denis go to the clinic?", options:["To get medicine for an allergy","To get a vaccine","To get a receipt","To book an exam"], answer:0, scene:'scenes/scene_13.webp'},
    {passage:"Denis enters a bookstore and looks for Portuguese practice books. He asks the assistant for beginner level books.", question:"What is Denis looking for?", options:["A gift for a friend","A Portuguese practice book","A city map","A novel in English"], answer:1, scene:'scenes/scene_14.webp'},
    {passage:"Denis leaves the city in the morning. A hotel shuttle picks him up at 6:15 and he confirms the airport terminal number twice.", question:"Why does Denis confirm the terminal?", options:["To pay the driver","To make sure he goes to the right airport","To order breakfast","To change his flight"], answer:1, scene:'scenes/scene_15.webp'}
  ];

  var state = { idx: 0, score: 0, answered: false };

  function setScene(url, idx) {
    var grad = $('sceneGradient');
    var label = $('sceneLabel');
    var img = $('scene');
    if (label) label.textContent = SCENE_LABELS[idx] || 'scene';
    if (grad) grad.style.display = 'grid';
    if (img) img.style.display = 'none';
    if (!url) return;
    var test = new window.Image();
    test.onload = function() {
      if (grad) grad.style.display = 'none';
      if (img) { img.style.display = 'block'; img.src = url; }
    };
    test.onerror = function() {
      if (grad) grad.style.display = 'grid';
      if (img) img.style.display = 'none';
    };
    test.src = url;
  }

  function render() {
    try {
      var item = ITEMS[state.idx];
      $('max').textContent = String(ITEMS.length);
      $('pts').textContent = String(state.score);
      $('counter').textContent = 'Q ' + (state.idx + 1) + ' / ' + ITEMS.length;
      $('qtext').textContent = item.question;
      $('passage').textContent = item.passage;
      setScene(item.scene, state.idx);
      $('choices').innerHTML = item.options.map(function(o, i) {
        return '<div class="choice" data-i="' + i + '">' + String.fromCharCode(65 + i) + '. ' + o + '</div>';
      }).join('');
      state.answered = false;
    } catch (e) {
      console.error(e);
      var q = $('qtext');
      if (q) q.textContent = 'Error loading question.';
    }
  }

  function ensurePips() {
    var p = $('progress');
    if (!p || p.children.length) return;
    ITEMS.forEach(function(_, i) {
      var d = document.createElement('div');
      d.className = 'pip';
      d.id = 'pip-' + i;
      p.appendChild(d);
    });
  }

  function pick(i) {
    if (state.answered) return;
    state.answered = true;
    var item = ITEMS[state.idx];
    var correct = i === item.answer;
    var choices = document.querySelectorAll('.choice');
    choices.forEach(function(el, j) {
      el.classList.add('disabled');
      if (j === item.answer) el.classList.add('correct');
      else if (j === i && !correct) el.classList.add('wrong');
    });
    var pip = $('pip-' + state.idx);
    if (pip) pip.className = 'pip done' + (correct ? ' hit' : '');
    if (correct) {
      state.score += 1;
      $('pts').textContent = String(state.score);
    }
    setTimeout(function() {
      state.idx += 1;
      if (state.idx >= ITEMS.length) showResult();
      else render();
    }, correct ? 900 : 1500);
  }

  function showResult() {
    var pct = Math.round((state.score / ITEMS.length) * 100);
    $('result').style.display = 'flex';
    $('rtitle').textContent = 'Quiz Complete';
    $('rtext').textContent = state.score + ' / ' + ITEMS.length + ' (' + pct + '%)';
  }

  $('choices').addEventListener('click', function(e) {
    var el = e.target.closest('.choice');
    if (!el) return;
    pick(Number(el.dataset.i));
  });

  $('replay').addEventListener('click', function() {
    state.idx = 0;
    state.score = 0;
    state.answered = false;
    $('result').style.display = 'none';
    render();
  });

  function boot() {
    ensurePips();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
