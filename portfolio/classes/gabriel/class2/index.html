<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday English — Basic Quiz</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0f14;
    color: #e8eaed;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-y: auto;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .header {
    width: 100%; max-width: 980px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .title { font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .score { font-size: 14px; color: #9aa7b2; letter-spacing: 1px; }
  .stage {
    position: relative;
    width: 100%; max-width: 980px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    background: #000;
  }
  .scene-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .scene-gradient {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: #0b141c;
  }
  .scene-gradient .label {
    font-size: 28px; font-weight: 800; color: #dce6ee; text-align: center;
    letter-spacing: 1px; text-transform: uppercase; opacity: .35;
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 35%, transparent 55%, rgba(0,0,0,0.75) 100%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }
  .question-card {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    background: rgba(8,12,18,0.82);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
    min-height: 120px;
  }
  .counter {
    font-size: 11px; color: #9aa7b2; letter-spacing: 1.4px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .qtext {
    font-size: 16px; line-height: 1.35; color: #f4f5f7;
  }
  .choices {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice {
    height: 60px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: #f1f3f5; font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  .choice:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  .choice:active { transform: translateY(1px) scale(0.98); }
  .choice.disabled { opacity: .55; pointer-events: none; }
  .choice.correct { border-color: #00e6b8; color: #b9f6ea; box-shadow: 0 0 20px rgba(0,230,184,0.25); }
  .choice.wrong { border-color: #ff6b6b; color: #fcc; box-shadow: 0 0 20px rgba(255,107,107,0.25); }
  .progress { width: 100%; max-width: 980px; display: flex; gap: 6px; }
  .pip {
    height: 8px; flex: 1; border-radius: 4px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14);
  }
  .pip.done { background: linear-gradient(90deg, #00e6b8, #00ffc8); border-color: transparent; box-shadow: 0 0 10px rgba(0,255,200,0.35); }
  .footer { font-size: 11px; color: #5b6572; letter-spacing: 1px; }
  .result {
    position: absolute; inset: 0;
    background: rgba(4,8,14,0.85);
    backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    padding: 24px; text-align: center;
  }
  .result h2 { margin: 0; font-size: 28px; }
  .result p { margin: 0; color: #c8cdd4; }
  .result button {
    height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    color: #f4f5f7; font-weight: 800; letter-spacing: .5px;
    padding: 0 18px; cursor: pointer;
  }
  .hint {
    width: 100%; max-width: 980px;
    font-size: 11px; color: #5b6572; text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Everyday English — Basic Quiz</div>
    <div class="score"><span id="pts">0</span>/<span id="max">0</span></div>
  </div>

  <div class="stage">
    <div class="scene-gradient"><div class="label" id="sceneLabel">SCENE</div></div>
    <img id="scene" class="scene-bg" style="display:none;" alt="scene">
    <div class="vignette"></div>
    <div class="question-card">
      <div class="counter" id="counter">Q 1 / 30</div>
      <div class="qtext" id="qtext">Initializing...</div>
    </div>
    <div class="result" id="result">
      <h2 id="rtitle">Result</h2>
      <p id="rtext"></p>
      <button id="replay">Play Again</button>
    </div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="choices" id="choices"></div>
  <div class="hint">Comic-style backgrounds in scenes/scene_01.png ... scenes/scene_30.png</div>
  <div class="footer">GABRIEL — Everyday English · Basic Quiz</div>

<script>
(function() {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const SCENE_LABELS = [
    'Supermarket','Subway','Doctor reception','Apartment hall','Cafe','Park',
    'Classroom','Bank counter','Sidewalk','Open office','Pharmacy','Library',
    'Beach','Airport gate','Restaurant table','Drive-thru','Gas station','Hospital hall',
    'School entrance','Phone booth','Parking lot','Museum','Market checkout','Kitchen',
    'Plaza','Train station','Hotel lobby','Gym','Bookstore','Rainy street'
  ];

  const QUESTIONS = [
    {q:'She ___ at the supermarket every Saturday.', opts:['go','goes','is going','going'], a:1, c:'scenes/scene_01.png'},
    {q:'Look! It ___ right now.', opts:['rains','is raining','rain','rained'], a:1, c:'scenes/scene_30.png'},
    {q:'Listen! The baby ___.', opts:['sleeps','is sleeping','slept','was sleeping'], a:1, c:'scenes/scene_04.png'},
    {q:'Last night I ___ to a party.', opts:['go','goes','went','was going'], a:2, c:'scenes/scene_02.png'},
    {q:'Tom is a student. He studies at the local ___.', opts:['school','company','hospital','park'], a:0, c:'scenes/scene_07.png'},
    {q:'I have never ___ Japanese food.', opts:['eat','ate','eaten','eating'], a:2, c:'scenes/scene_05.png'},
    {q:'They ___ football in the park this afternoon.', opts:['plays','is playing','play','are playing'], a:3, c:'scenes/scene_06.png'},
    {q:'Yesterday I ___ a coffee after work.', opts:['take','took','taken','taking'], a:1, c:'scenes/scene_05.png'},
    {q:'The bus ___ at 7:30 tomorrow.', opts:['leave','leaves','is leaving','left'], a:1, c:'scenes/scene_02.png'},
    {q:'Quiet, please! The baby ___.', opts:['sleeps','is sleeping','slept','was sleeping'], a:1, c:'scenes/scene_04.png'},
    {q:'I ___ my keys. Can you help me?', opts:["don't have","doesn't have","didn't have",'have'], a:0, c:'scenes/scene_09.png'},
    {q:'Last summer we ___ to the beach every weekend.', opts:['go','goes','went','were going'], a:2, c:'scenes/scene_13.png'},
    {q:'This coffee ___ terrible. I want another.', opts:['tastes','is tasting','tasted','was tasting'], a:0, c:'scenes/scene_05.png'},
    {q:'She ___ the dishes while he ___ TV.', opts:['washes / watches','is washing / watches','washed / was watching','washes / is watching'], a:1, c:'scenes/scene_24.png'},
    {q:'I ___ my passport at home. Oh no!', opts:['forget','forgot','have forgotten','am forgetting'], a:2, c:'scenes/scene_04.png'},
    {q:'This street ___ always busy on weekends.', opts:['is','are','am','be'], a:0, c:'scenes/scene_09.png'},
    {q:'___ you ever ___ Japanese food?', opts:["Do / eat","Did / ate","Have / eaten","Are / eating"], a:2, c:'scenes/scene_05.png'},
    {q:'When I arrived, they ___ dinner.', opts:['had','were having','have had','are having'], a:1, c:'scenes/scene_15.png'},
    {q:'I think we ___ late if we don\'t leave now.', opts:['are','were','will be','have been'], a:2, c:'scenes/scene_09.png'},
    {q:'The doctor says I ___ too much coffee.', opts:['am drinking','drink','drank','have drunk'], a:0, c:'scenes/scene_03.png'},
    {q:'My neighbor ___ music all night last Saturday.', opts:['plays','played','was playing','is playing'], a:2, c:'scenes/scene_04.png'},
    {q:'I usually ___ to work, but today I ___ the train.', opts:['drive / take','drive / am taking','drove / take','drive / took'], a:1, c:'scenes/scene_26.png'},
    {q:'Look at that sky. It ___.', opts:['rains','rained','is going to rain','is raining'], a:2, c:'scenes/scene_30.png'},
    {q:'I ___ my phone. I can\'t find it anywhere.', opts:['lose','lost','have lost','am losing'], a:2, c:'scenes/scene_20.png'},
    {q:'They ___ not speak English at home.', opts:['does','do','is','are'], a:1, c:'scenes/scene_04.png'},
    {q:'By 8 PM I ___ the report.', opts:['finish','will finish','finished','am finishing'], a:1, c:'scenes/scene_10.png'},
    {q:'The train ___ when we got to the station.', opts:['left','was left','leaves','is leaving'], a:0, c:'scenes/scene_26.png'},
    {q:'He ___ for the same company for 10 years.', opts:['works','worked','has worked','is working'], a:2, c:'scenes/scene_10.png'},
    {q:'I need to ___ the doctor tomorrow.', opts:['to see','seeing','see','saw'], a:0, c:'scenes/scene_03.png'},
    {q:'___ there a pharmacy near here?', opts:['Is','Are','Do','Does'], a:0, c:'scenes/scene_11.png'}
  ];

  const state = { idx: 0, score: 0, answered: false };

  function setSceneBg(url, idx) {
    const grad = $('sceneGradient');
    const label = $('sceneLabel');
    const img = $('scene');
    if (label) label.textContent = SCENE_LABELS[idx] || 'scene';
    if (grad) grad.style.display = 'grid';
    if (img) img.style.display = 'none';
    if (!url) return;
    const test = new window.Image();
    test.onload = function() {
      if (grad) grad.style.display = 'none';
      if (img) { img.style.display = 'block'; img.src = url; }
    };
    test.onerror = function() {
      if (grad) grad.style.display = 'grid';
      if (img) img.style.display = 'none';
    };
    test.src = url;
  }

  function render() {
    try {
      var q = QUESTIONS[state.idx];
      $('max').textContent = String(QUESTIONS.length);
      $('pts').textContent = String(state.score);
      $('counter').textContent = 'Q ' + (state.idx + 1) + ' / ' + QUESTIONS.length;
      $('qtext').textContent = (state.idx + 1) + '. ' + q.q;
      setSceneBg(q.c, state.idx);
      $('choices').innerHTML = q.opts.map(function(o, i) {
        return '<div class="choice" data-i="' + i + '">' + String.fromCharCode(65 + i) + '. ' + o + '</div>';
      }).join('');
      state.answered = false;
    } catch (e) {
      console.error(e);
      var qtextEl = $('qtext');
      if (qtextEl) qtextEl.textContent = 'Error loading question.';
    }
  }

  function ensurePips() {
    var p = $('progress');
    if (!p || p.children.length) return;
    QUESTIONS.forEach(function(_, i) {
      var d = document.createElement('div');
      d.className = 'pip';
      d.id = 'pip-' + i;
      p.appendChild(d);
    });
  }

  function pick(i) {
    if (state.answered) return;
    state.answered = true;
    var q = QUESTIONS[state.idx];
    var correct = i === q.a;
    var choices = document.querySelectorAll('.choice');
    choices.forEach(function(el, j) {
      el.classList.add('disabled');
      if (j === q.a) el.classList.add('correct');
      else if (j === i && !correct) el.classList.add('wrong');
    });
    var pip = $('pip-' + state.idx);
    if (pip) pip.className = 'pip done' + (correct ? ' hit' : '');
    if (correct) {
      state.score += 1;
      $('pts').textContent = String(state.score);
    }
    setTimeout(function() {
      state.idx += 1;
      if (state.idx >= QUESTIONS.length) showResult();
      else render();
    }, correct ? 900 : 1500);
  }

  function showResult() {
    var pct = Math.round((state.score / QUESTIONS.length) * 100);
    $('result').style.display = 'flex';
    $('rtitle').textContent = 'Quiz Complete';
    $('rtext').textContent = state.score + ' / ' + QUESTIONS.length + ' (' + pct + '%)';
  }

  $('choices').addEventListener('click', function(e) {
    var el = e.target.closest('.choice');
    if (!el) return;
    pick(Number(el.dataset.i));
  });

  $('replay').addEventListener('click', function() {
    state.idx = 0;
    state.score = 0;
    state.answered = false;
    $('result').style.display = 'none';
    render();
  });

  function boot() {
    ensurePips();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
