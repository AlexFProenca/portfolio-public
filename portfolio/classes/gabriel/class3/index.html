<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Comprehension — Basic Quiz</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0f14;
    color: #e8eaed;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-y: auto;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .header {
    width: 100%; max-width: 980px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .title { font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .score { font-size: 14px; color: #9aa7b2; letter-spacing: 1px; }
  .stage {
    position: relative;
    width: 100%; max-width: 980px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    background: #000;
  }
  .scene-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .scene-gradient {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: #0b141c;
  }
  .scene-gradient .label {
    font-size: 28px; font-weight: 800; color: #dce6ee; text-align: center;
    letter-spacing: 1px; text-transform: uppercase; opacity: .35;
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 35%, transparent 55%, rgba(0,0,0,0.75) 100%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }
  .passage-card {
    position: absolute; left: 12px; right: 12px; top: 12px;
    background: rgba(8,12,18,0.78);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
    min-height: 90px;
  }
  .passage-label {
    font-size: 11px; color: #9aa7b2; letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 6px;
  }
  .passage {
    font-size: 15px; line-height: 1.35; color: #f4f5f7;
  }
  .question-card {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    background: rgba(8,12,18,0.82);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
    min-height: 120px;
  }
  .counter {
    font-size: 11px; color: #9aa7b2; letter-spacing: 1.4px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .qtext {
    font-size: 16px; line-height: 1.35; color: #f4f5f7;
  }
  .choices {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice {
    height: 60px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: #f1f3f5; font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  .choice:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  .choice:active { transform: translateY(1px) scale(0.98); }
  .choice.disabled { opacity: .55; pointer-events: none; }
  .choice.correct { border-color: #00e6b8; color: #b9f6ea; box-shadow: 0 0 20px rgba(0,230,184,0.25); }
  .choice.wrong { border-color: #ff6b6b; color: #fcc; box-shadow: 0 0 20px rgba(255,107,107,0.25); }
  .progress { width: 100%; max-width: 980px; display: flex; gap: 6px; }
  .pip {
    height: 8px; flex: 1; border-radius: 4px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14);
  }
  .pip.done { background: linear-gradient(90deg, #00e6b8, #00ffc8); border-color: transparent; box-shadow: 0 0 10px rgba(0,255,200,0.35); }
  .pip.hit { background: #00e6b8; }
  .footer { font-size: 11px; color: #5b6572; letter-spacing: 1px; }
  .result {
    position: absolute; inset: 0;
    background: rgba(4,8,14,0.85);
    backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    padding: 24px; text-align: center;
  }
  .result h2 { margin: 0; font-size: 28px; }
  .result p { margin: 0; color: #c8cdd4; }
  .result button {
    height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    color: #f4f5f7; font-weight: 800; letter-spacing: .5px;
    padding: 0 18px; cursor: pointer;
  }
  .hint {
    width: 100%; max-width: 980px;
    font-size: 11px; color: #5b6572; text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Reading Comprehension</div>
    <div class="score"><span id="pts">0</span>/<span id="max">15</span></div>
  </div>

  <div class="stage">
    <div class="scene-gradient"><div class="label" id="sceneLabel">scene</div></div>
    <img id="scene" class="scene-bg" style="display:none;" alt="scene">
    <div class="vignette"></div>
    <div class="passage-card" id="passageCard">
      <div class="passage-label">Passage</div>
      <div class="passage" id="passage">Initializing...</div>
    </div>
    <div class="question-card">
      <div class="counter" id="counter">Q 1 / 15</div>
      <div class="qtext" id="qtext">Initializing...</div>
    </div>
    <div class="result" id="result">
      <h2 id="rtitle">Result</h2>
      <p id="rtext">Score text</p>
      <button id="replay">Play Again</button>
    </div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="choices" id="choices"></div>
  <div class="hint">Optional backgrounds in scenes/scene_01.png ... scenes/scene_15.png</div>
  <div class="footer">GABRIEL — Everyday English · Reading Comprehension</div>

<script>
(function() {
  'use strict';
  var $ = function(id) { return document.getElementById(id); };

  var ITEMS = [
    {passage:"Ana goes to the store to buy bread. She pays at the counter and leaves.", question:"Where does Ana go?", options:["Store","School","Park","Hospital"], answer:0, scene:'scenes/scene_01.png'},
    {passage:"The pharmacist gives the medicine to Mr. Lima. The pharmacy is on the corner.", question:"Who receives the medicine?", options:["Ana","Mr. Lima","The nurse","The doctor"], answer:1, scene:'scenes/scene_02.png'},
    {passage:"Pedro sits on a bench in the park. The children play near the tree.", question:"Where is Pedro?", options:["At school","In the park","On the bus","At home"], answer:1, scene:'scenes/scene_03.png'},
    {passage:"Clara orders soup and water at the restaurant. The waiter smiles and brings the food.", question:"What does Clara order?", options:["Pizza and juice","Soup and water","Rice and beans","Coffee and cake"], answer:1, scene:'scenes/scene_04.png'},
    {passage:"Lucas cooks dinner in the kitchen. He fries eggs and toast for breakfast instead.", question:"What does Lucas cook?", options:["Dinner","Lunch","Snack","Dessert"], answer:0, scene:'scenes/scene_05.png'},
    {passage:"Maria teaches math in the classroom. The students listen and write in their notebooks.", question:"What does Maria teach?", options:["English","History","Math","Science"], answer:2, scene:'scenes/scene_06.png'},
    {passage:"Joao crosses the street to catch the bus. The light turns red and he stops.", question:"What does Joao do?", options:["Cross the street","Buy a ticket","Park the car","Clean the window"], answer:0, scene:'scenes/scene_07.png'},
    {passage:"The sun is hot. Patricia buys ice cream and walks on the sand.", question:"Where is Patricia?", options:["At the mall","On the beach","At the airport","At the bank"], answer:1, scene:'scenes/scene_08.png'},
    {passage:"Rafa picks fruit from a box at the market. He chooses apples and bananas.", question:"Where is Rafa?", options:["At the market","At school","In the park","At the restaurant"], answer:0, scene:'scenes/scene_09.png'},
    {passage:"Julia reads a book at the library. She looks for novels near the window.", question:"Where is Julia?", options:["At the library","At school","At home","At work"], answer:0, scene:'scenes/scene_10.png'},
    {passage:"Marco writes an email at the desk. The office is quiet and clean.", question:"Where is Marco?", options:["At the office","At the store","At the restaurant","At the park"], answer:0, scene:'scenes/scene_11.png'},
    {passage:"The train arrives at the station. Paula waits on the platform with a small bag.", question:"Where does Paula wait?", options:["At the bus stop","On the platform","In the taxi","In the car"], answer:1, scene:'scenes/scene_12.png'},
    {passage:"Dr. Costa checks the patient in the office. The exam is quick and simple.", question:"Where does the doctor work?", options:["Pharmacy","School","Office","Hospital office"], answer:3, scene:'scenes/scene_13.png'},
    {passage:"Leo buys a notebook at the bookstore. He pays at the counter and leaves a review.", question:"Where does Leo buy the notebook?", options:["Library","Bookstore","School","Office"], answer:1, scene:'scenes/scene_14.png'},
    {passage:"The music plays and guests dance at the party. The room is full of colorful lights.", question:"Where is the party?", options:["At school","At the park","In a room","At the beach"], answer:2, scene:'scenes/scene_15.png'}
  ];

  var SCENE_LABELS = [
    'Store','Pharmacy','Park','Restaurant','Kitchen',
    'School','Street','Beach','Market','Library',
    'Office','Train station','Doctor office','Bookstore','Party room'
  ];

  var state = { idx: 0, score: 0, answered: false };

  function setScene(url, idx) {
    var grad = $('sceneGradient');
    var label = $('sceneLabel');
    var img = $('scene');
    if (label) label.textContent = SCENE_LABELS[idx] || 'scene';
    if (grad) grad.style.display = 'grid';
    if (img) img.style.display = 'none';
    if (!url) return;
    var test = new window.Image();
    test.onload = function() {
      if (grad) grad.style.display = 'none';
      if (img) { img.style.display = 'block'; img.src = url; }
    };
    test.onerror = function() {
      if (grad) grad.style.display = 'grid';
      if (img) img.style.display = 'none';
    };
    test.src = url;
  }

  function render() {
    try {
      var item = ITEMS[state.idx];
      $('max').textContent = String(ITEMS.length);
      $('pts').textContent = String(state.score);
      $('counter').textContent = 'Q ' + (state.idx + 1) + ' / ' + ITEMS.length;
      $('qtext').textContent = item.question;
      $('passage').textContent = item.passage;
      setScene(item.scene, state.idx);
      $('choices').innerHTML = item.options.map(function(o, i) {
        return '<div class="choice" data-i="' + i + '">' + String.fromCharCode(65 + i) + '. ' + o + '</div>';
      }).join('');
      state.answered = false;
    } catch (e) {
      console.error(e);
      var q = $('qtext');
      if (q) q.textContent = 'Error loading question.';
    }
  }

  function ensurePips() {
    var p = $('progress');
    if (!p || p.children.length) return;
    ITEMS.forEach(function(_, i) {
      var d = document.createElement('div');
      d.className = 'pip';
      d.id = 'pip-' + i;
      p.appendChild(d);
    });
  }

  function pick(i) {
    if (state.answered) return;
    state.answered = true;
    var item = ITEMS[state.idx];
    var correct = i === item.answer;
    var choices = document.querySelectorAll('.choice');
    choices.forEach(function(el, j) {
      el.classList.add('disabled');
      if (j === item.answer) el.classList.add('correct');
      else if (j === i && !correct) el.classList.add('wrong');
    });
    var pip = $('pip-' + state.idx);
    if (pip) pip.className = 'pip done' + (correct ? ' hit' : '');
    if (correct) {
      state.score += 1;
      $('pts').textContent = String(state.score);
    }
    setTimeout(function() {
      state.idx += 1;
      if (state.idx >= ITEMS.length) showResult();
      else render();
    }, correct ? 900 : 1500);
  }

  function showResult() {
    var pct = Math.round((state.score / ITEMS.length) * 100);
    $('result').style.display = 'flex';
    $('rtitle').textContent = 'Quiz Complete';
    $('rtext').textContent = state.score + ' / ' + ITEMS.length + ' (' + pct + '%)';
  }

  $('choices').addEventListener('click', function(e) {
    var el = e.target.closest('.choice');
    if (!el) return;
    pick(Number(el.dataset.i));
  });

  $('replay').addEventListener('click', function() {
    state.idx = 0;
    state.score = 0;
    state.answered = false;
    $('result').style.display = 'none';
    render();
  });

  function boot() {
    ensurePips();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
