<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Seed Network — Rafaella</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 800px at 10% 10%, rgba(0,0,0,0.35), transparent),
      linear-gradient(180deg, #0b0d10, #14181d 55%, #0a0c0f);
    color: #e7e9ee;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 56px 1fr 36px;
    grid-template-areas:
      "header header"
      "stage board"
      "footer footer";
    height: 100vh;
    width: 100vw;
  }

  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: rgba(10, 12, 14, 0.65);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  header h1 {
    font-size: 14px;
    letter-spacing: .35em;
    text-transform: uppercase;
    margin: 0;
    color: #c9cdd4;
  }
  .pill {
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #cfd3dc;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px;
    border-radius: 999px;
  }

  #stage {
    grid-area: stage;
    position: relative;
    overflow: hidden;
    background: #000;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  #scene, #char {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #char {
    pointer-events: none;
    object-fit: contain;
    object-position: bottom center;
    height: 80%;
    width: auto;
    max-width: 55%;
    bottom: 0;
    top: auto;
    left: 50%;
    transform: translateX(-50%);
  }
  #vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 600px at 50% 40%, transparent 55%, rgba(0,0,0,0.65) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.85));
    pointer-events: none;
  }
  #dialogue {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 22px;
    padding: 16px 18px;
    background: linear-gradient(180deg, rgba(18,21,26,0.85), rgba(10,12,14,0.95));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    backdrop-filter: blur(12px);
  }
  #speaker {
    font-size: 11px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #8a919c;
    margin: 0 0 6px;
  }
  #text {
    font-size: 15px;
    line-height: 1.45;
    color #edf0f5;
    margin: 0;
    min-height: 42px;
  }
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
  }
  .choice {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #e7e9ee;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    line-height: 1.3;
    text-align: left;
    transition: transform .06s ease, background .2s ease, border-color .2s ease;
  }
  .choice:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22); }
  .choice:active { transform: translateY(1px); }

  #board {
    grid-area: board;
    overflow: auto;
    padding: 14px;
    background: linear-gradient(180deg, rgba(14,16,20,0.9), rgba(10,12,14,0.95));
    border-left: 1px solid rgba(255,255,255,0.06);
  }
  #board h2 {
    font-size: 11px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #8a919c;
    margin: 0 0 10px;
  }
  .clue {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .clue .icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: grid;
    place-items: center;
    font-size: 14px;
    color: #cfd3dc;
    flex-shrink: 0;
  }
  .clue .content {
    font-size: 12px;
    line-height: 1.4;
    color #d3d6de;
  }
  .clue .content strong {
    display: block;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: #9aa1ac;
    margin-bottom: 2px;
  }
  .empty {
    font-size: 12px;
    color: #7a818c;
    line-height: 1.4;
  }

  footer {
    grid-area: footer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: rgba(10,12,14,0.75);
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: #8a919c;
  }
  #sanity { color: #d6dadd; }
  #stress { color: #cf5c5c; }

  #intro, #end {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 800px at 50% 30%, rgba(0,0,0,0.35), transparent),
                linear-gradient(180deg, #0b0d10, #14181d);
  }
  #end {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(6, 7, 9, 0.92);
    z-index: 60;
  }
  #end .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .35;
    filter: saturate(0.6) contrast(1.1);
  }
  #end .panel {
    position: relative;
    max-width: 720px;
    width: 92%;
    padding: 26px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(12, 14, 18, 0.92);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    text-align: center;
  }
  #end h1 {
    font-size: 22px;
    letter-spacing: .25em;
    text-transform: uppercase;
    margin: 0 0 8px;
    color: #e7e9ee;
  }
  #end p {
    color: #b8bcc6;
    line-height: 1.55;
    margin: 0 0 16px;
  }
  #end .meta {
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #8a919c;
    margin-bottom: 14px;
  }
  #end button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.07);
    color: #e7e9ee;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  #end button:hover { background: rgba(255,255,255,0.14); }

  .hidden { display: none !important; }

  @media (max-width: 860px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 48px 1fr auto 28px;
      grid-template-areas:
        "header"
        "stage"
        "board"
        "footer";
    }
    #board { max-height: 34vh; }
  }
</style>
</head>
<body>
  <div id="intro">
    <div class="panel">
      <h1>The Seed Network</h1>
      <p>Class 2 — Infiltration</p>

      <div id="vignette"></div>
      <div id="dialogue">

        <p id="text"></p>
        <div id="choices"></div>
      </div>
      <div id="debug" style="position:absolute;top:8px;left:10px;color:#cf5c5c;font:10px monospace;background:rgba(0,0,0,.55);padding:6px;display:none;"></div>

    <aside id="board">
      <h2>Detective Board</h2>
      <div id="clues">
        <p class="empty">No clues collected yet.</p>
      </div>
    </aside>

    <footer>
      <div>
        <span id="sanity">Sanity: 100</span>
      </div>
      <div>
        <span id="stress">Stress: 0</span>
      </div>
    </footer>
  </div>

let sanity = 100;
let stress = 0;
let current = null;
let clues = [];

function setSanity(n) {
  sanity = Math.max(0, Math.min(100, n));
  $('sanity').textContent = 'Sanity: ' + sanity;
  if (sanity <= 0) renderEnd('end_burned');
}

function addStress(n) {
  stress += n;
  $('stress').textContent = 'Stress: ' + stress;
  setSanity(sanity - n);
}

function addClue(title, text) {
  if (clues.find(c => c.title === title)) return;
  clues.push({ title, text });
  const box = $('clues');
  const el = document.createElement('div');
  el.className = 'clue';
  el.innerHTML = '<div class="icon">🔎</div><div class="content"><strong>' + title + '</strong>' + text + '</div>';
  if (clues.length === 1) box.innerHTML = '';
  box.appendChild(el);
}

function renderScene(data) {
  const sceneImg = $('scene');
  const charImg = $('char');
  const speaker = $('speaker');
  const text = $('text');
  const choices = $('choices');

  sceneImg.src = data.scene || '';
  charImg.classList.add('hidden');
  if (data.character) {
    charImg.src = data.character;
    charImg.classList.remove('hidden');
  }
  speaker.textContent = '— ' + (data.speaker || '');
  text.textContent = data.text || '';
  choices.innerHTML = '';

  if (data.clue) addClue(data.clue.title, data.clue.text);
  if (data.stress) addStress(data.stress);

  if (data.choices && data.choices.length) {
    data.choices.forEach((choice) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = choice.label;
      btn.addEventListener('click', () => {
        const target = choice.target;
        if (typeof target === 'string' && target.startsWith('end_')) {
          renderEnd(target);
        } else if (typeof target === 'string' && target.startsWith('win_')) {
          renderWin(target);
        } else if (typeof target === 'number') {
          current = target;
          renderScene(STORY[target]);
        }
      });
      choices.appendChild(btn);
    });
  }
}

function renderEnd(key) {
  const data = ENDS[key];
  current = null;
  showEnd('End: ' + key.replace('end_', '').toUpperCase(), data.text, data.scene);
}

function renderWin(key) {
  const data = WIN[key];
  current = null;
  showEnd('Case Solved: ' + key.replace('win_', '').toUpperCase(), data.text, data.scene);
}

function showEnd(title, text, scene) {
  $('app').classList.add('hidden');
  $('end').classList.remove('hidden');
  document.querySelector('#end h1').textContent = title;
  $('endText').textContent = text;
  if (scene) {
    const bg = document.createElement('img');
    bg.src = scene;
    bg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;';
    const wrap = $('end');
    if (!wrap.querySelector('img')) wrap.prepend(bg);
  }
}

$('startBtn').addEventListener('click', () => {
  $('intro').classList.add('hidden');
  $('app').classList.remove('hidden');
  sanity = 100; stress = 0; clues = [];
  $('sanity').textContent = 'Sanity: 100';
  $('stress').textContent = 'Stress: 0';
  current = 1;
  renderScene(STORY[1]);
});

$('againBtn').addEventListener('click', () => {
  $('end').classList.add('hidden');
  $('intro').classList.remove('hidden');
  const old = $('end').querySelector('img');
  if (old) old.remove();
});
